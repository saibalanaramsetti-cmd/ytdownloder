services:
  - type: web
    name: mediaflow-api
    runtime: docker
    dockerfilePath: docker/Dockerfile.backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: SECRET_KEY
        generateValue: true
